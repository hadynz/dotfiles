# ==============================================================================
# Tmux Keybindings
# ==============================================================================
# Prefix key is Ctrl+A (configured in tmux.conf).
#
# Notation:
#   Prefix + X      = Ctrl+A, then X
#   Prefix + Ctrl+X = Ctrl+A, then Ctrl+X
#   Ctrl+X          = direct (no prefix needed, uses bind -n)
#   [copy-mode] X   = only active in vi copy-mode
#
# Inspired by Omerxx
# @see https://github.com/omerxx/dotfiles/blob/master/tmux/tmux.reset.conf
# ==============================================================================

# ------------------------------------------------------------------------------
# Session & Client Management
# ------------------------------------------------------------------------------

bind ^X lock-server              # Prefix + Ctrl+X  — lock tmux server
bind ^D detach                   # Prefix + Ctrl+D  — detach from session
bind *  list-clients             # Prefix + *       — show connected clients
bind s  choose-tree -s           # Prefix + s       — session/window tree picker
bind S  choose-session           # Prefix + S       — session picker (flat list)

# ------------------------------------------------------------------------------
# Window Management
# ------------------------------------------------------------------------------

bind n   new-window -c "#{pane_current_path}"  # Prefix + n   — new window (inherits cwd)
bind w   list-windows                          # Prefix + w   — list windows
bind r   command-prompt "rename-window %%"     # Prefix + r   — rename current window
bind '"' choose-window                         # Prefix + "   — interactive window picker

# ------------------------------------------------------------------------------
# Pane Management
# ------------------------------------------------------------------------------

bind \\ split-window -h -c "#{pane_current_path}"  # Prefix + \   — split side-by-side
bind -  split-window -v -c "#{pane_current_path}"  # Prefix + -   — split top/bottom
bind d  kill-pane                                   # Prefix + d   — close current pane
bind x  resize-pane -Z                              # Prefix + x   — toggle zoom (maximize/restore)
bind P  set pane-border-status                      # Prefix + P   — toggle pane border labels

# ------------------------------------------------------------------------------
# Misc
# ------------------------------------------------------------------------------

bind :  command-prompt  # Prefix + :   — open tmux command prompt
bind R  source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded"  # Prefix + R — reload config

# ------------------------------------------------------------------------------
# Terminal Toggle (IDE-style)
# ------------------------------------------------------------------------------
# Mimics VSCode/WebStorm's Ctrl+` terminal toggle inside tmux.
# The actual keys (C-y, C-x) are remapped from C-` and C-S-` in iTerm2.
# @see tmux/scripts/tmux-toggle-term.sh for the toggle logic.

bind-key -n 'C-y' run-shell -b "$HOME/.config/tmux/scripts/tmux-toggle-term.sh"       # Ctrl+Y — toggle bottom terminal pane
bind-key -n 'C-x' run-shell -b "$HOME/.config/tmux/scripts/tmux-toggle-term.sh float" # Ctrl+X — toggle floating terminal popup

# ------------------------------------------------------------------------------
# Vim-Aware Pane Resizing
# ------------------------------------------------------------------------------
# When vim/neovim is running, Ctrl+Arrow keys pass through to vim.
# Otherwise, they resize the tmux pane. Works with aserowy/tmux.nvim.
# @see https://github.com/aserowy/tmux.nvim?tab=readme-ov-file#resize

is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n 'C-Left'  if-shell "$is_vim" 'send-keys C-Left'  'resize-pane -L 1'  # Ctrl+Left  — resize pane left
bind -n 'C-Down'  if-shell "$is_vim" 'send-keys C-Down'  'resize-pane -D 1'  # Ctrl+Down  — resize pane down
bind -n 'C-Up'    if-shell "$is_vim" 'send-keys C-Up'    'resize-pane -U 1'  # Ctrl+Up    — resize pane up
bind -n 'C-Right' if-shell "$is_vim" 'send-keys C-Right' 'resize-pane -R 1'  # Ctrl+Right — resize pane right

# Same resize keys also work while in copy-mode
bind-key -T copy-mode-vi C-Left  resize-pane -L 1  # [copy-mode] Ctrl+Left  — resize left
bind-key -T copy-mode-vi C-Down  resize-pane -D 1  # [copy-mode] Ctrl+Down  — resize down
bind-key -T copy-mode-vi C-Up    resize-pane -U 1  # [copy-mode] Ctrl+Up    — resize up
bind-key -T copy-mode-vi C-Right resize-pane -R 1  # [copy-mode] Ctrl+Right — resize right

# ------------------------------------------------------------------------------
# Copy Mode (Vi-style)
# ------------------------------------------------------------------------------
# Enter copy mode with Prefix + [, then use these vim-like bindings.
# Requires `setw -g mode-keys vi` in tmux.conf.

bind-key -T copy-mode-vi 'v'      send -X begin-selection          # [copy-mode] v      — start visual selection
bind-key -T copy-mode-vi 'y'      send -X copy-selection           # [copy-mode] y      — yank selection
bind-key -T copy-mode-vi 'Y'      send -X copy-end-of-line         # [copy-mode] Y      — yank to end of line
bind-key -T copy-mode-vi 'Escape' send -X cancel                   # [copy-mode] Escape — exit copy mode
bind-key -T copy-mode-vi 'Enter'  send -X copy-pipe-and-cancel "pbcopy"  # [copy-mode] Enter — yank to macOS clipboard

