# ==============================================================================
# Tmux Configuration
# ==============================================================================
# Keybindings are defined separately in tmux.keybindings.conf for clarity.
# Prefix key: Ctrl+A (instead of default Ctrl+B)
# ==============================================================================

# Load keybindings (splits, panes, copy-mode, terminal toggle, vim-aware resize)
source-file ~/.config/tmux/tmux.keybindings.conf

# ------------------------------------------------------------------------------
# General Settings
# ------------------------------------------------------------------------------

set -g prefix ^A                 # use Ctrl+A as prefix (easier to reach than Ctrl+B)
set -g base-index 1              # number windows starting at 1 (matches keyboard layout)
set -g detach-on-destroy off     # stay in tmux when closing last pane in a session
set -g escape-time 0             # no delay after pressing Escape (important for vim)
set -g history-limit 1000000     # generous scrollback buffer (~1M lines)
set -g renumber-windows on       # keep window numbers sequential when one is closed
set -g set-clipboard on          # allow tmux to set the system clipboard
set -g status-position top       # status bar at the top (macOS convention)
set -g mouse on                  # enable mouse for scrolling, pane selection, resizing
set -g default-terminal "${TERM}" # inherit terminal type from parent shell
setw -g mode-keys vi             # use vim-style keys in copy mode and menus

# ------------------------------------------------------------------------------
# Pane Appearance
# ------------------------------------------------------------------------------

# Catppuccin Mocha base color for the active pane — makes it easy to see which
# pane has focus when multiple splits are open.
set -g window-active-style "bg=#1e1e2e"

# ------------------------------------------------------------------------------
# Plugins (TPM)
# ------------------------------------------------------------------------------
# Install/update plugins: prefix + I
# Uninstall removed plugins: prefix + alt + u
# Full list: https://github.com/tmux-plugins/list

set -g @plugin 'tmux-plugins/tpm'             # TPM itself (plugin manager)
set -g @plugin 'tmux-plugins/tmux-sensible'    # community-agreed sensible defaults
set -g @plugin 'tmux-plugins/tmux-yank'        # copy to system clipboard (y in copy-mode)
set -g @plugin 'tmux-plugins/tmux-resurrect'   # persist sessions across tmux server restarts
set -g @plugin 'tmux-plugins/tmux-continuum'   # auto-save/restore sessions (pairs with resurrect)
set -g @plugin 'sainnhe/tmux-fzf'              # fuzzy-find sessions/windows/panes (prefix + F)
set -g @plugin 'wfxr/tmux-fzf-url'             # extract & open URLs from pane output (prefix + u)
set -g @plugin 'catppuccin/tmux'               # catppuccin theme
set -g @plugin 'aserowy/tmux.nvim'             # seamless navigation/resize between tmux & neovim
set -g @plugin 'omerxx/tmux-sessionx'          # enhanced session manager (prefix + o)
set -g @plugin 'jaclu/tmux-menus'              # command palette menu (prefix + \)
set -g @plugin 'b0o/tmux-autoreload'           # auto-reload config on file change
set -g @plugin 'noscript/tmux-mighty-scroll'   # better scroll behavior in alternate screen apps

# ------------------------------------------------------------------------------
# Plugin Configuration
# ------------------------------------------------------------------------------

# tmux-fzf-url: popup dimensions and styling for URL picker
set -g @fzf-url-fzf-options '-p 60%,30% --prompt="   " --border-label=" Open URL "'
set -g @fzf-url-history-limit '2000'

# ------------------------------------------------------------------------------
# Theme: Catppuccin (Config 3 layout)
# ------------------------------------------------------------------------------
# Uses the "Config 3" status bar layout from catppuccin/tmux.
# After changing theme settings, run: tmux kill-server
# @see https://github.com/catppuccin/tmux?tab=readme-ov-file#config-3

set -g @catppuccin_flavour 'mocha'  # options: latte, frappe, macchiato, mocha

# Window tabs: powerline-style separators with window number on the right
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator " "
set -g @catppuccin_window_middle_separator " █"
set -g @catppuccin_window_number_position "right"
set -g @catppuccin_window_default_fill "number"
set -g @catppuccin_window_default_text "#W"
set -g @catppuccin_window_current_fill "number"
set -g @catppuccin_window_current_text "#W"

# Status bar modules: what info is shown on the left and right sides
set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_modules_right "application directory user host session"
set -g @catppuccin_status_left_separator  " "
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_fill "icon"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_directory_text "#{pane_current_path}"

# ------------------------------------------------------------------------------
# TPM Bootstrap (MUST be at the very bottom)
# ------------------------------------------------------------------------------

# Auto-install TPM and plugins on a fresh machine (no manual git clone needed)
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# Initialize TPM — this line MUST remain last
run '~/.tmux/plugins/tpm/tpm'

